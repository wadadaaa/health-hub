services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://health:${POSTGRES_PASSWORD}@db:5432/health
      PORT: "3000"
      MCP_PATH_SECRET: ${MCP_PATH_SECRET:?set MCP_PATH_SECRET in .env}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      OURA_CLIENT_ID: ${OURA_CLIENT_ID:-}
      OURA_CLIENT_SECRET: ${OURA_CLIENT_SECRET:-}
      OURA_TOKEN: ${OURA_TOKEN:-}
      OURA_CRON: ${OURA_CRON:-17 * * * *}
      OURA_BACKFILL_DAYS: ${OURA_BACKFILL_DAYS:-3}
      TZ_LOCAL: ${TZ_LOCAL:-Asia/Jerusalem}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
